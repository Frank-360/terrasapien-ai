<!DOCTYPE html>

<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TerraSense</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
    font-family: 'Segoe UI', Arial;
    background: #f4f7f6;
    padding: 20px;
}

.container {
    max-width: 750px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
}

h2,h5 {
    text-align: center;
    color: #2e7d32;
}

#map {
    height: 400px;
    margin: 15px 0;
    border-radius: 8px;
}

label {
    font-weight: 600;
}

input, select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    background: #2e7d32;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}


.status {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 5px;
}

.status.green { color: #2e7d32; }
.status.orange { color: #f9a825; }
.status.red { color: #c62828; }



.action-box {
    background: #fff8e1;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
    font-size: 15px;
}

.ai-box {
    background: #e3f2fd;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
    font-size: 15px;
    color: #0d47a1;
}

.result-card {
    background: #f8f9fb;
    border-radius: 18px;
    padding: 24px;
    margin: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
}
@media (max-width: 600px) {
    .result-card {
        padding: 16px;
    }

    .action-card,
    .info-card,
    .insight-card {
        padding: 12px;
    }
}

/* STATUS */
.status-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    color: #ff9800;
    font-size: 18px;
}

.status-dot {
    width: 12px;
    height: 12px;
    background: #ffeb3b;
    border-radius: 50%;
}

.message {
    margin: 8px 0 20px;
    color: #555;
    font-size: 16px;
}

/* ACTION CARD */
.action-card {
    display: flex;
    gap: 15px;
    background: #e8f5e9;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 20px;
}

.action-left {
    font-size: 26px;
}

.action-title {
    font-size: 14px;
    font-weight: 600;
    color: #2e7d32;
}

.action-text {
    font-size: 18px;
    font-weight: 500;
}

@media (max-width: 600px) {
    .action-text {
        font-size: 16px;
    }

    .info-value {
        font-size: 16px;
    }

    .message {
        font-size: 15px;
    }
}


/* GRID */
.info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

@media (max-width: 600px) {
    .info-grid {
        grid-template-columns: 1fr;   /* 🔥 stack vertically */
    }
}

/* INFO CARDS */
.info-card {
    display: flex;
    gap: 12px;
    padding: 16px;
    border-radius: 14px;
}

@media (max-width: 600px) {
    .info-card {
        flex-direction: row;
        align-items: center;
    }
}

.temp-card {
    background: #e3f2fd;
}

.rain-card {
    background: #fff8e1;
}

.info-icon {
    font-size: 26px;
}

.info-title {
    font-size: 14px;
    color: #666;
}

.info-value {
    font-size: 18px;
    font-weight: 600;
    word-wrap: break-word;
    overflow-wrap: break-word;
}

#soil-moisture {
    font-size: 1.4rem;
    font-weight: bold;
    margin-top: 8px;
    color: #00d084;
}


.moisture-high {
    color: #00d084;
}

.moisture-medium {
    color: #ffb020;
}

.moisture-low {
    color: #ff4d4f;
}


/* INSIGHT */
.insight-card {
    display: flex;
    gap: 12px;
    background: #eef3ff;
    border-radius: 14px;
    padding: 16px;
    margin-top: 20px;
}

.insight-icon {
    font-size: 24px;
}

.insight-title {
    font-size: 14px;
    font-weight: 600;
    color: #3949ab;
}

.insight-text {
    font-size: 15px;
}

/* EARNINGS */
.earnings {
    margin-top: 20px;
    font-weight: 600;
    color: #2e7d32;
    font-size: 16px;
}

.money {
    margin-top: 15px;
    font-size: 14px;
    font-weight: 600;
    color: #2e7d32;
}


</style>

</head>

<body>

<div class="container">

<h2>🌱 TerraSense</h2>
<h5>The intelligence layer for modern farming</h5>

<div style="display:flex; gap:10px;">
    <div style="flex:1;">
        <label>Crop</label>
        <select id="crop">
            <option>Maize</option>
            <option>Rice</option>
            <option>Cassava</option>
            <option>Millet</option>
        </select>
    </div>


<div style="flex:1;">
    <label>Farm Size</label>
    <input id="size" value="2">
</div>


</div>

<div style="display:flex; gap:10px;">
    <div style="flex:1;">
        <label>Irrigation Method</label>
        <select id="method">
            <option>Rain-fed</option>
            <option>Manual (bucket)</option>
            <option>Small pump</option>
            <option>Large pump</option>
        </select>
    </div>


<div style="flex:1;">
    <label>Irrigation Frequency</label>
    <select id="frequency">
        <option>Rarely</option>
        <option>Weekly</option>
        <option>2-3 times/week</option>
        <option>Daily</option>
    </select>
</div>


</div>

<button onclick="getLocation()" style="background:#0288d1;">📍 Use My Location</button>

<p style="text-align:center;">OR</p>

<div id="map"></div>

<input id="lat" readonly placeholder="Latitude">
<input id="lon" readonly placeholder="Longitude">

<button onclick="analyzeFarm()">Analyze</button>

<div id="result" class="result"></div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// MAP
var map = L.map('map').setView([7.38, 3.93], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
}).addTo(map);

var marker;

// Click map
map.on('click', function(e) {
    updateLocation(e.latlng.lat, e.latlng.lng);
});

// Shared update function
function updateLocation(lat, lon){
    document.getElementById("lat").value = lat;
    document.getElementById("lon").value = lon;

    if (marker) map.removeLayer(marker);
    marker = L.marker([lat, lon]).addTo(map);

    map.setView([lat, lon], 13);
}

// GPS
function getLocation() {
    if (!navigator.geolocation) {
        alert("Geolocation not supported");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        pos => {
            updateLocation(pos.coords.latitude, pos.coords.longitude);
            setTimeout(analyzeFarm, 300); // safe auto-run
        },
        () => alert("Location denied")
    );
}

// ANALYZE
function analyzeFarm(){

    const lat = document.getElementById("lat").value;
    const lon = document.getElementById("lon").value;

    if(!lat || !lon){
        alert("Select location first");
        return;
    }

    document.getElementById("result").innerHTML = "⏳ Analyzing...";

    fetch("https://terrasense-ai.onrender.com/analyze", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
            lat: parseFloat(lat),
            lon: parseFloat(lon),
            crop: document.getElementById("crop").value,
            farm_size: parseFloat(document.getElementById("size").value),
            method: document.getElementById("method").value,
            frequency: document.getElementById("frequency").value
        })
    })
    .then(r => r.json())
    .then(data => {
    
    if (!data) {
        document.getElementById("result").innerHTML = "❌ Invalid response";
        return;
    }

    const soilMoisture = data.soil_moisture;

    let status = data.crop_status || "Unknown";

    let message = "";
    let action = data.advice || "No recommendation";

    if (status === "Healthy") {
        message = "Your crops have enough water and are growing well.";
    }
    else if (status.includes("Moderate")) {
        message = "Your crops are starting to get dry.";
    }
    else {
        message = "Your crops need water urgently to avoid damage.";
    }

    // ✅ FIXED rain logic (SYNC WITH BACKEND)
let rainMsg = "No rain data";

if (data.time_to_rain !== undefined && data.time_to_rain !== null) {

    if (data.time_to_rain === 0) {
        rainMsg = "🌧 It is currently raining";

    } else if (data.time_to_rain <= 6) {
        rainMsg = "🌧 Rain expected within hours";

    } else if (data.time_to_rain <= 24) {
        rainMsg = "🌦 Rain expected today";

    } else if (data.time_to_rain >= 999) {
       rainMsg =  "☀️ No rain expected — irrigation recommended within 24 hours";

    } else {
        rainMsg = "🌤 Rain expected in " + Math.round(data.time_to_rain / 24) + " days";
    }
}


    let colorClass = "green";
if (status.includes("Moderate")) colorClass = "orange";
if (status.includes("High")) colorClass = "red";

let output = `
<div class="result-card">

    <div class="status-row">
        <span class="status-dot"></span>
        <span class="status-text">${status}</span>
    </div>

    <div class="message">
        ${message}
    </div>

    <div class="action-card">
        <div class="action-left">🌿</div>
        <div>
            <div class="action-title">Recommended Action</div>
            <div class="action-text">${action}</div>
        </div>
    </div>

    <div class="info-grid">
        <div class="info-card temp-card">
            <div class="info-icon">🌡</div>
            <div>
                <div class="info-title">Temperature</div>
                <div class="info-value">${data.temperature ?? "-"}°C</div>
            </div>
        </div>

        <div class="info-card rain-card">
            <div class="info-icon">🌤</div>
            <div>
                <div class="info-title">Rain Forecast</div>
                <div class="info-value">${rainMsg}</div>
            </div>
        </div>
    </div>

        <div class="result-card">
            <h3>💧 Soil Moisture</h3>
            <p id="soil-moisture"></p>
         </div>

    <div class="insight-card">
        <div class="insight-icon">🤖</div>
        <div>
            <div class="insight-title">AI Insight</div>
            <div class="insight-text">${data.ai_insight}</div>
        </div>
    </div>

    <span>
💰 ${
    data.carbon_value_usd > 0.1
    ? "Earn up to $" + data.carbon_value_usd
    : "Carbon savings are low today"
}
</span>

</div>
`;

document.getElementById("result").innerHTML = output;

const soilElement = document.getElementById("soil-moisture");

soilElement.innerHTML =
    `💧 Soil Moisture: ${data.soil_moisture}%`;

soilElement.classList.remove(
    "moisture-high",
    "moisture-medium",
    "moisture-low"
);

if (data.soil_moisture >= 70) {
    soilElement.classList.add("moisture-high");
}
else if (data.soil_moisture >= 45) {
    soilElement.classList.add("moisture-medium");
}
else {
    soilElement.classList.add("moisture-low");
}

console.log("SOIL MOISTURE:", data.soil_moisture);

})

.catch(()=>{
    document.getElementById("result").innerHTML = "❌ Server error";
});


} // ✅ CLOSE analyzeFarm function

    </script>
    </body>
    </html>
